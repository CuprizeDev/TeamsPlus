messages:
  no-permission: '&8[&5&l!&8] &cYou do not have permission to run that command!'
  invalid-args: '&8[&5&l!&8] &c/team help'
  invalid-sub-args: '&8[&5&l!&8] &c{COMMAND} {ARGS}'
  only-players: '&8[&5&l!&8] &cOnly players can use this command!'
  offline-player: '&8[&5&l!&8] &cThat player is not currently online, or has not logged in before!'
  invalid-team: '&8[&5&l!&8] &cThat is not a valid team!'
  need-team: '&8[&5&l!&8] &cYou must have a team to run this command!'
  not-in-team: '&8[&5&l!&8] &cThis player is not in your team!'
  disband: '&8[&5&l!&8] &cYou have disbanded your team!'
  already-in-team: '&8[&5&l!&8] &cYou are already in a team! You cannot run that command!'
  artifacts:
    locked: '&8[&5&l!&8] &cYou must upgrade the artifacts upgrade in order to unlock this slot!'
    invalid-artifact: '&8[&5&l!&8] &cThat is not a valid artifact!'
    add-sender: '&8[&5&l!&8] &aYou have given {PLAYER} a {TIER-COLOR}{TYPE}&a artifact!'
    add-recipient: '&8[&5&l!&8] &aYou have been given a {TIER-COLOR}{TYPE}&a artifact!'
    artifact-added: '&8[&5&l!&8] &aYou have added a {TIER-COLOR}{TYPE} &aartifact to your team!'
    artifact-removed: '&8[&5&l!&8] &cYou have removed a {TIER-COLOR}{TYPE} &cartifact to your team!'
    already-applied: '&8[&5&l!&8] &cYou have already applied this artifact to your team!'
    fly-disabled: '&8[&5&l!&8] &cYou do not have permission to fly in this area!'
    fly-enabled: '&8[&5&l!&8] &aYour fly has been enabled in team claims!'
  location:
    team-message: '&8[&5&l!&8] &7{PLAYER}s Location: {WORLD}, {X}, {Y}, {Z}'
  chat:
    enabled: '&8[&5&l!&8] &aYou have enabled team chat!'
    disabled: '&8[&5&l!&8] &cYou have disabled team chat!'
    team-chat: '&a[{TEAM}] | &a{PLAYER}: &f{MESSAGE}'
    team-chat-spy: ''
  join:
    joined: '&8[&5&l!&8] &aYou have successfully joined {TEAM}!'
    team-message: ''
    maximum-members: '&8[&5&l!&8] &cThis team has already reached the maximum member limit!'
    not-invited: '&8[&5&l!&8] &cYou have not been invited to this team!'
  leave:
    leave: '&8[&5&l!&8] &cYou have successfully left {TEAM}!'
    team-message: ''
    not-in-team: '&8[&5&l!&8] &cYou are not in a team! So you cannot leave!'
    cant-leave: '&8[&5&l!&8] &cYou cannot leave this faction you are the leader! You must disband it by running /team disband!'
  invite:
    sent: '&8[&5&l!&8] &aYou have sent a team invite to {PLAYER}!'
    in-team: '&8[&5&l!&8] &e{PLAYER} is already in your team!'
    already-sent: '&8[&5&l!&8] &eYou have already sent an invite to {PLAYER}!'
    received: '&8[&5&l!&8] &aYou have received a team invite from {TEAM}!'
    cannot-invite-self: '&8[&5&l!&8] &cYou cannot invite yourself to your own team!'
    is-not-invited: '&8[&5&l!&8] &e{PLAYER} has not been invited to your team!'
    removed: '&8[&5&l!&8] &cThe invite for {PLAYER} has been removed!'
    team-message: ''
  kick:
    sent: '&8[&5&l!&8] &cYou have kicked {PLAYER} from your team!'
    received: '&8[&5&l!&8] &cYou have been kicked from {TEAM}!'
    cannot-kick-self: '&8[&5&l!&8] &cYou cannot kick yourself from your own team!'
    team-message: ''
  promote:
    sent: '&8[&5&l!&8] &aYou have promoted {PLAYER} to {RANK}!'
    received: '&8[&5&l!&8] &aYou have been promoted to {RANK}!'
    cant-promote-self: '&8[&5&l!&8] &cYou cannot promote yourself!'
    cant-promote: '&8[&5&l!&8] &cYou cannot promote this player!'
    cant-promote-leader: '&8[&5&l!&8] &cYou must run the command /team leader <player>, in order to promote this player to leader!'
    team-message: ''
  demote:
    sent: '&8[&5&l!&8] &aYou have demoted {PLAYER} to {RANK}!'
    received: '&8[&5&l!&8] &aYou have been demoted to {RANK}!'
    cant-demote-self: '&8[&5&l!&8] &cYou cannot demote yourself!'
    cant-demote: '&8[&5&l!&8] &cYou cannot demote this player!'
    cant-demote-member: '&8[&5&l!&8] &cYou must run the command /team kick <player>, in order to remove this player from the team!'
    team-message: ''
  ally:
    sent: '&8[&5&l!&8] &aYour team has sent an ally request to {TEAM}!'
    sent-already: '&8[&5&l!&8] &eYou have already sent an ally request to {TEAM}!'
    already-allied: '&8[&5&l!&8] &eYou are already allied with {TEAM}!'
    received: '&8[&5&l!&8] &a{TEAM} has sent an ally request to your team!'
    cannot-ally-self: '&8[&5&l!&8] &cYou cannot send an ally request to your own team!'
    maximum-allies: '&8[&5&l!&8] &cYour team has already reached the maximum ally limit!'
    not-allied: '&8[&5&l!&8] &cYou are not allied with {TEAM}!'
    removed: '&8[&5&l!&8] &cYour team are no longer allies with {TEAM}!'
    request-removed: '&8[&5&l!&8] &cYou are no longer requesting to be allies with {TEAM}!'
    allied: '&8[&5&l!&8] &aYour team is now allied with {TEAM}!'
    request-already-sent: '&8[&5&l!&8] &cYou have already sent a ally request to {TEAM}!'
    team-message: ''
  tags:
    no-team: 'None'
    team: '&c{TEAM}&r'
    taken: '&8[&5&l!&8] &cThat team name has already been taken!'
    changed: '&8[&5&l!&8] &aYou have changed your team name to {TEAM}!'
    same: '&8[&5&l!&8] &cYour team name cannot be the same as the current one!'
    contains-special: '&8[&5&l!&8] &cThat text contains special characters!'
    within-length: '&8[&5&l!&8] &cYour team name must be between 3-10 characters!'
  help:
    help-message:
      - '&8&m----------&r&8< &2Team Help &8>&m----------'
      - '&f* &c/team top'
      - '&f* &c/team help'
      - '&f* &c/team invite <player>'
      - '&f* &c/team uninvite <player>'
      - '&f* &c/team kick <player>'
      - '&f* &c/team join <team>'
      - '&f* &c/team leader <player>'
      - '&f* &c/team demote <player>'
      - '&f* &c/team promote <player>'
      - '&f* &c/team leave'
      - '&f* &c/team disband'
      - '&f* &c/team findchest'
      - '&f* &c/team rename <name>'
      - '&f* &c/team info <team>'
      - '&8&m--------------------------------------------'
  home:
    commence: '&8[&5&l!&8] &eYou will teleport to your team home in {TIME} seconds!'
    success: '&8[&5&l!&8] &aYou have successfully teleported to your team home'
    failed: '&8[&5&l!&8] &cThe teleportation request to your team home has failed!'
  chest:
    give: '&8[&5&l!&8] &aYou haven given {PLAYER} a claim chest!'
    received: '&8[&5&l!&8] &aYou have received a claim chest! Place this down to create a team!'
    placed: '&8[&5&l!&8] &aYou have placed a claim chest and created a team!'
    has-team: '&8[&5&l!&8] &cYou already have a team! You cannot place a claim chest and create a team when you already have one!'
    already-claimed: '&8[&5&l!&8] &cThis chunk has already been claimed by another team!'
    find: '&8[&5&l!&8] &7Chest Location: &5{X}x, {Y}y, {Z}z'
    must-place: '&8[&5&l!&8] &cYou must place a claim chest to create a team!'
  list:
    header: '&7&m----------&r&7[ &2Team List {PAGE-NUMBER}&7/&2{PAGE-COUNT} &7]&m----------'
    message: '&2{TEAM} &7- {ONLINE} / {MEMBERS} online, {POWER} power'
  upgrades:
    upgraded: '&8[&5&l!&8] &aYou have purchased a {UPGRADE} upgrade to level {LEVEL} for your team!'
    not-enough: '&8[&5&l!&8] &cYou do not have enough money to purchase this upgrade!'
    maximum-level: '&8[&5&l!&8] &cYour team has reached the maximum level for that upgrade!'
  info:
    team-message:
      - '&8&m----------&r&8< {TEAM} &7[{ONLINE}/{TOTAL} &8>&m----------'
      - '&f* &7Leader: {LEADER}'
      - '&f* &7Co-Leaders: {CO-LEADERS}'
      - '&f* &7Officers: {OFFICERS}'
      - '&f* &7Members: {MEMBERS}'
      - '&f* &7Allies: {ALLIES}'
      - '&f* &7Claims: {CLAIMS}'
      - '&f* &7Power: {POWER}'
      - '&8&m--------------------------------------------'