shield:
  safe-zones:
    spawn:
      world: "world"
      minX: -100
      maxX: 100
      minY: 0
      maxY: 320
      minZ: -100
      maxZ: 100

  settings:
    max-charge-seconds: 86400
    min-auto-activate-seconds: 3600
    deploy-time-seconds: 900
    diminishing-returns-threshold: 3
    diminishing-returns-rate: 0.10

  menu:
    title: '&8{TEAM} Shield'
    size: 45
    filler:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      amount: 1
      lore:
        - ""
      glow: true
    close:
      material: BARRIER
      name: "&c&lCLOSE"
      amount: 1
      lore:
        - ""
      glow: false
    back:
      material: ARROW
      name: "&e&lBACK"
      amount: 1
      lore:
        - ""
      glow: false
    status:
      slot: 21
      active:
        material: SHIELD
        name: "&b&lShield Active"
        lore:
          - "&7Your team's shield is currently &aactive&7."
          - ""
          - "&fCharge: &e{CHARGE}"
          - "&fActive For: &e{ACTIVE_TIME}"
          - ""
          - "&c&oClick to deactivate"
        glow: true
      deploying:
        material: CLOCK
        name: "&e&lShield Deploying..."
        lore:
          - "&7Your shield is deploying."
          - ""
          - "&fDeploy Time Remaining: &e{DEPLOY_TIME}"
          - ""
          - "&7&oShield will activate once deployed."
        glow: true
      cooldown:
        material: GRAY_DYE
        name: "&c&lShield on Cooldown"
        lore:
          - "&7Your shield is on cooldown."
          - ""
          - "&fCooldown: &c{COOLDOWN}"
          - "&fCharge: &e{CHARGE}"
        glow: false
      inactive:
        material: SHIELD
        name: "&7&lShield Inactive"
        lore:
          - "&7Your team's shield is not active."
          - ""
          - "&fCharge: &e{CHARGE}"
          - "&fMin Required: &e1 Hour"
          - ""
          - "&a&oClick to activate"
        glow: false
    auto-toggle:
      slot: 23
      enabled:
        material: LIME_DYE
        name: "&a&lAuto Shield: ON"
        lore:
          - "&7Shield will automatically activate"
          - "&7when all members go offline."
          - ""
          - "&e&oClick to disable"
        glow: true
      disabled:
        material: GRAY_DYE
        name: "&c&lAuto Shield: OFF"
        lore:
          - "&7Shield will not activate automatically."
          - ""
          - "&e&oClick to enable"
        glow: false
